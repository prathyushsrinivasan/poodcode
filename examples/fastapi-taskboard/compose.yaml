services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: taskboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taskboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  taskboard-data:
